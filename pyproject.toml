[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ProjetoRendaAutomatica"
version = "1.3.0"
description = "Plataforma modular para descoberta, análise, monetização e publicação automática de oportunidades comerciais."
authors = [
    { name = "Radar de Ofertas" }
]
requires-python = ">=3.11"

# ============================================================
# BLACK
# ============================================================

[tool.black]
line-length = 100
target-version = ["py311"]
skip-string-normalization = false

# ============================================================
# ISORT
# ============================================================

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

# ============================================================
# RUFF
# ============================================================

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B"
]

ignore = [
    "E501",
    "UP038"
]

# ============================================================
# MYPY
# ============================================================

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# ============================================================
# PYTEST
# ============================================================

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "tests"
]

addopts = [
    "-ra",
    "--strict-markers"
]

# ============================================================
# COVERAGE
# ============================================================

[tool.coverage.run]
source = [
    "."
]

omit = [
    "tests/*",
    ".venv/*"
]

[tool.coverage.report]
show_missing = true
skip_covered = false
